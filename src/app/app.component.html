<ng-container *ngIf="isAdmin; else defaultLayout">
  <div id="webcrumbs" class="w-full min-h-screen bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
      <app-sidebar></app-sidebar>
      <div class="flex-1 flex flex-col overflow-hidden">
        <app-dash-navbar></app-dash-navbar>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #defaultLayout>
  <app-navbar-logged *ngIf="isLoggedIn"></app-navbar-logged>
  <app-navbar *ngIf="!isLoggedIn"></app-navbar>
  <router-outlet></router-outlet>
  <app-footer></app-footer>
</ng-template>
