<main id="webcrumbs" class="flex-1 overflow-y-auto bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm overflow-hidden">
    <div class="p-6">
      <div class="mb-6 flex items-center">
        <mat-icon class="text-[#c1121f] mr-2">person_add</mat-icon>
        <h2 class="text-xl font-semibold text-gray-800">Player Information</h2>
      </div>
      <form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="col-span-1">
            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
            <input type="text" id="firstName" formControlName="firstName"
                   class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200"
                   placeholder="Enter first name" />
          </div>
          <div class="col-span-1">
            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input type="text" id="lastName" formControlName="lastName"
                   class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200"
                   placeholder="Enter last name" />
          </div>
          <div class="col-span-1">
            <label for="birthday" class="block text-sm font-medium text-gray-700 mb-1">Birthday</label>
            <input type="date" id="birthday" formControlName="birthday"
                   class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200" />
          </div>
          <div class="col-span-1">
            <label for="nationality" class="block text-sm font-medium text-gray-700 mb-1">Nationality</label>
            <input type="text" id="nationality" formControlName="nationality"
                   class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200"
                   placeholder="Enter nationality" />
          </div>
          <div class="col-span-1">
            <label for="number" class="block text-sm font-medium text-gray-700 mb-1">Jersey Number</label>
            <input type="number" id="number" formControlName="number" min="1" max="99"
                   class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200"
                   placeholder="Enter jersey number" />
          </div>
          <div class="col-span-1">
            <label for="position" class="block text-sm font-medium text-gray-700 mb-1">Position</label>
            <select id="position" formControlName="position"
                    class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f] focus:border-[#c1121f] transition-all duration-200">
              <option value="" disabled selected>Select position</option>
              <option value="GOALKEEPER">Goalkeeper</option>
              <option value="DEFENDER">Defender</option>
              <option value="MIDFIELDER">Midfielder</option>
              <option value="ATTACKER">Attacker</option>
            </select>
          </div>
          <div class="col-span-2">
            <label for="picture" class="block text-sm font-medium text-gray-700 mb-1">Player Picture</label>
            <div class="mt-1 flex items-center">
              <div class="w-32 h-32 rounded-lg bg-gray-100 flex items-center justify-center border-2 border-dashed border-gray-300 mr-4 overflow-hidden group relative">
                <mat-icon class="text-gray-400 text-4xl group-hover:text-gray-500 transition-colors">add_photo_alternate</mat-icon>
                <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                  <span class="text-white text-sm font-medium">Change Photo</span>
                </div>
                <input type="file" id="picture" (change)="onFileSelected($event)"
                       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required />
              </div>
              <div class="flex flex-col justify-center">
                <p class="text-xs text-gray-500">Upload a player profile picture.</p>
                <p class="text-xs text-gray-500 mt-1">JPG, PNG or GIF, max 2MB.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-10 border-t border-gray-200 pt-6 flex justify-end space-x-3">
          <button type="button" (click)="onCancel()"
                  style="padding: 10px 20px; border-radius: 8px; border: 1px solid #d1d5db; color: #374151; background-color: transparent; transition: background-color 0.2s ease-in-out;"
                  onmouseover="this.style.backgroundColor='#f9fafb'"
                  onmouseout="this.style.backgroundColor='transparent'">
            Cancel
          </button>

          <button type="submit" [disabled]="isSubmitting"
                  style="padding: 10px 20px; background-color: #c1121f; color: white; border-radius: 8px; display: flex; align-items: center; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;"
                  onmouseover="this.style.backgroundColor='#780000'; this.style.transform='scale(1.05)'"
                  onmouseout="this.style.backgroundColor='#c1121f'; this.style.transform='scale(1)'">
            <mat-icon style="padding:4px;margin-right: 5px; font-size: 16px;">save</mat-icon> Save Player
          </button>

        </div>
      </form>
    </div>
  </div>
</main>
