<main class="flex-1 overflow-y-auto bg-gray-100 p-4">
  <div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6 animate-fadeIn">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center w-full md:w-auto"> <a routerLink="/add-news"
                                                            class="inline-flex items-center px-4 py-2 bg-[#c1121f] text-white rounded-lg hover:bg-[#780000] transition-colors duration-200 shadow-sm hover:shadow-md transform hover:scale-105 transition-all w-full md:w-auto justify-center md:justify-start">
          <span class="material-symbols-outlined mr-2">add</span> Add News </a> </div>
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
          <div class="relative w-full sm:w-64"> <input type="text" placeholder="Search news..."
                                                       class="w-full p-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f]/50 focus:border-[#c1121f] transition-all duration-200" />
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"> <span
              class="material-symbols-outlined">search</span> </span> </div>
          <details class="relative w-full sm:w-auto">
            <summary
              class="flex items-center justify-between w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer list-none">
                        <span class="flex items-center text-gray-700"> <span
                          class="material-symbols-outlined mr-2">filter_list</span> Filters </span> <span
              class="material-symbols-outlined ml-2 text-gray-500">expand_more</span> </summary>
            <div class="absolute right-0 top-full mt-2 w-64 bg-white shadow-xl rounded-lg p-4 z-50">
              <h4 class="font-medium text-gray-800 mb-3">Filter News</h4>
              <div class="space-y-4">
                <div> <label class="block text-sm font-medium text-gray-700 mb-1">Category</label> <select
                  class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f]/50 focus:border-[#c1121f] transition-all duration-200">
                  <option value="">All Categories</option>
                  <option value="team">Team News</option>
                  <option value="matches">Match Reports</option>
                  <option value="transfers">Transfers</option>
                  <option value="club">Club News</option>
                  <option value="fans">Fan Zone</option>
                </select> </div>
                <div> <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                  <div class="flex items-center space-x-2"> <input type="date"
                                                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f]/50 focus:border-[#c1121f] transition-all duration-200" />
                    <span class="text-gray-500">-</span> <input type="date"
                                                                class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f]/50 focus:border-[#c1121f] transition-all duration-200" />
                  </div>
                </div>
                <div> <label class="block text-sm font-medium text-gray-700 mb-1">Status</label> <select
                  class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1121f]/50 focus:border-[#c1121f] transition-all duration-200">
                  <option value="">All Status</option>
                  <option value="published">Published</option>
                  <option value="draft">Draft</option>
                  <option value="archived">Archived</option>
                </select> </div>
                <div class="flex items-center justify-between pt-2"> <button
                  class="text-gray-600 hover:text-gray-800 transition-colors text-sm"> Reset Filters
                </button> <button
                  class="px-4 py-2 bg-[#c1121f] text-white rounded-lg hover:bg-[#780000] transition-colors text-sm">
                  Apply Filters </button> </div>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm overflow-hidden mb-6 animate-fadeIn hidden md:block">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cover Image</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let news of newsList" class="hover:bg-gray-50 transition-colors animate-fadeIn">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="w-16 h-12 rounded-md overflow-hidden bg-gray-100">
                <img [src]="getImageUrl(news.cover)" [alt]="news.title" class="w-full h-full object-cover object-center" />
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="font-medium text-gray-900">{{ news.title }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-gray-700">
              <div class="flex items-center">
                <span class="material-symbols-outlined mr-1 text-sm text-gray-500">calendar_today</span>
<!--                <span>{{ news.date | date: 'dd MMM yyyy' }}</span>-->
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 py-1 text-xs rounded-full" >
              Test
            </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center">
              <div class="flex items-center justify-center space-x-2">
                <button class="p-1 rounded-full hover:bg-gray-100 text-blue-600 hover:text-blue-800 transition-colors">
                  <span class="material-symbols-outlined text-[18px]">visibility</span>
                </button>
                <button class="p-1 rounded-full hover:bg-gray-100 text-amber-600 hover:text-amber-800 transition-colors">
                  <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>
                <button
                  class="p-1 rounded-full hover:bg-gray-100 text-red-600 hover:text-red-800 transition-colors"
                  (click)="news.id && deleteNews(news.id)">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>  </div>
</main>
